<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AdamCrypt</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #08080d;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;

    background: #12121b;

    border: 1px solid #292936;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 0 35px rgba(0, 255, 170, 0.08);
}

h1 {
    text-align: center;

    margin-bottom: 5px;
}

.subtitle {
    text-align: center;

    color: #777;

    margin-bottom: 25px;
}

label {
    display: block;

    margin:
        15px 0 8px;

    color: #aaa;
}

textarea,
input,
select {

    width: 100%;

    background: #09090e;

    color: white;

    border: 1px solid #303040;

    border-radius: 12px;

    padding: 13px;

    font-size: 16px;

    outline: none;
}

textarea {
    min-height: 130px;

    resize: vertical;
}

button {

    border: none;

    border-radius: 12px;

    padding: 14px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 20px;
}

.encrypt {

    background: #00c896;

    color: #00140f;
}

.decrypt {

    background: #3478f6;

    color: white;
}

.result {

    margin-top: 20px;
}

.error {

    margin-top: 15px;

    color: #ff6b6b;

    text-align: center;
}

.footer {

    text-align: center;

    color: #555;

    margin-top: 20px;

    font-size: 13px;
}

</style>

</head>


<body>

<div class="container">

<h1>🔐 AdamCrypt</h1>

<div class="subtitle">
Python + Flask Encryption Lab
</div>


<form method="POST">


<label>
الخوارزمية
</label>

<select name="algorithm">

<option value="caesar">
Caesar Cipher
</option>

<option value="vigenere">
Vigenère Cipher
</option>

<option value="xor">
XOR Cipher
</option>

</select>


<label>
الرسالة
</label>

<textarea
name="message"
placeholder="اكتب الرسالة هنا..."
>{{ request.form.get("message", "") }}</textarea>


<label>
المفتاح
</label>

<input
type="text"
name="key"
placeholder="اكتب المفتاح..."
value="{{ request.form.get('key', '') }}"
>


<div class="buttons">

<button
class="encrypt"
name="action"
value="encrypt">

🔒 تشفير

</button>


<button
class="decrypt"
name="action"
value="decrypt">

🔓 فك التشفير

</button>

</div>


</form>


{% if result %}

<div class="result">

<label>
النتيجة
</label>

<textarea
readonly
id="result">{{ result }}</textarea>

</div>

{% endif %}


{% if error %}

<div class="error">

❌ {{ error }}

</div>

{% endif %}


<div class="footer">

AdamCrypt v1 • Educational Project

</div>

</div>

</body>

</html>
